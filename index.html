<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Netflix Clone</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

<header class="navbar">
  <div class="logo">NETFLIX</div>
  <button class="btn-signin">Sign In</button>
</header>

<section class="hero">
  <div class="hero-content">
    <h1>Unlimited movies, TV shows, and more</h1>
    <h3>Watch anywhere. Cancel anytime.</h3>
    <p>Ready to watch? Enter your email to create or restart your membership.</p>
    
    <div class="email-form">
      <input type="email" placeholder="Email address">
      <button>Get Started</button>
    </div>
  </div>
</section>

<section class="movies">
  <h2>Popular on Netflix</h2>
  <div class="movie-row">
    <img src="https://via.placeholder.com/200x300/000000/FFFFFF?text=Movie+1">
    <img src="https://via.placeholder.com/200x300/111111/FFFFFF?text=Movie+2">
    <img src="https://via.placeholder.com/200x300/222222/FFFFFF?text=Movie+3">
    <img src="https://via.placeholder.com/200x300/333333/FFFFFF?text=Movie+4">
    <img src="https://via.placeholder.com/200x300/444444/FFFFFF?text=Movie+5">
  </div>
</section>

</body>
</html>
